[package]
name = "pcg-svg"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Directed hypergraph layout and SVG rendering for PCG visualizations"

[dependencies]
graphlay = { version = "0.3.0", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
roxmltree = "0.20"

